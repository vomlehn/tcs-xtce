# Makes include/tcs-dynxtce.h from src/lib.rs: make c-header.
language = "C"
include_guard = "TCS_DYNXTCE_H"
cpp_compat = true
style = "type"
documentation_style = "doxy"
# Short enough that the comments doxygen.py adds stay within 80 columns.
line_length = 76
tab_width = 8
autogen_warning = """\
/* Generated by cbindgen from rust/tcs-dynxtce-c/src/lib.rs: run
 * make c-header after changing it, rather than editing this file. */"""
header = """\
/* The C interface to tcs-xtce-dynamic, the tcs-xtce run-time codec, which
 * reads OMG XTCE documents while a program runs and packs and unpacks
 * their packets.  See docs/runtime-codec-design.rst. */"""

[export]
prefix = ""
# Functions return it as an int, so nothing names it.
include = ["tcs_dynxtce_status"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
