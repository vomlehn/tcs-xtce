[package]
name = "tcs-xtce-python"
# The tcs-xtce Python distribution's version, in pyproject.toml, which is
# the tcs-xtce crate's too.
version = "0.7.1"
edition = "2021"
description = """\
    The Python interface to the tcs-xtce crate: the extension module \
    tcs_xtce._native, which reads and writes XTCE for the tcs-xtce Python \
    distribution\
"""
license = "MIT OR Apache-2.0"
repository = "https://github.com/vomlehn/tcs-xtce"
# It reaches users only inside the Python wheels, which maturin builds from
# the repository's pyproject.toml.
publish = false

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# abi3 from Python 3.10, so one wheel serves every Python from 3.10 on.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
tcs-xtce = { path = "..", version = "=0.7.1" }

# A workspace of its own: maturin builds it for Python, apart from the
# crates in rust/, and its tests are the Python ones.
[workspace]
