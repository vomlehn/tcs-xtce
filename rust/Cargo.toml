[package]
name = "tcs-xtce"
version = "0.7.0"
edition = "2021"
description = """\
    A software tool: serialization and deserialization of OMG XTCE documents \
    into managed, preallocated buffers, and their digests; the packet runtime \
    that operational code runs is the tcsxtce crate\
"""
license = "MIT OR Apache-2.0"
# The repository's README, which is the crate's page on crates.io.
readme = "../README.md"
repository = "https://github.com/vomlehn/tcs-xtce"
keywords = ["xtce", "ccsds", "telemetry", "omg", "spacecraft"]
categories = [
    "aerospace::space-protocols",
    "encoding",
    "parser-implementations",
]
# What crates.io gets. Listing the files also packages src/generated.rs,
# which .gitignore leaves out because `make generate` writes it, so run
# `make generate` before `cargo publish`. The tests and the other examples
# need files from outside this directory, so they stay in the repository.
include = [
    "src/**/*.rs",
    "examples/xtce_roundtrip.rs",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
# The packet runtime, which flies: buffer, fixed, packet and value are its,
# and are re-exported here so that ground code finds them where it did.
tcsxtce = { path = "tcsxtce", version = "=0.7.0" }
[dev-dependencies]
# The examples that check tcsxtce-bnum.h against bnum print with bnum's own
# formatting.
bnum = { version = "0.14", features = ["alloc"] }

[lib]
path = "src/lib.rs"

# The runtime is a crate of its own, so that what flies is only what
# generated code runs on; both are tested from here.
[workspace]
members = [".", "tcsxtce"]
