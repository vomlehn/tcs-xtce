[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtce"
version = "0.3.0"
description = """\
    Flight software: serialization and deserialization of OMG XTCE documents \
    into managed, preallocated buffers, being integrated with NASA's cFS and \
    JPL's F Prime\
"""
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }

[tool.setuptools]
packages = ["xtce"]
