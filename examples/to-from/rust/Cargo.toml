[package]
name = "to-from"
version = "0.1.0"
edition = "2021"
publish = false
description = """\
    Writes and reads words of varying length, described in XTCE, so that any \
    language can read what any other wrote\
"""

[dependencies]
# The packet runtime the generated code runs on, and the digest.
tcsxtce = { path = "../../../rust/tcsxtce" }

# A stand-alone crate, not part of any enclosing workspace.
[workspace]
