[package]
name = "housekeeping"
version = "0.1.0"
edition = "2021"
publish = false
description = """\
    Encodes and decodes housekeeping packets with a length field, calibrated \
    values and an optional field\
"""

[dependencies]
# The packet runtime the generated code runs on.
tcsxtce = { path = "../../../rust/tcsxtce" }
# The digest, which is ground software.
tcs-xtce = { path = "../../../rust" }

# A stand-alone crate, not part of any enclosing workspace.
[workspace]
