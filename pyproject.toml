# The Python packages: the runtime that generated Python code imports, and
# the compiler that generates code in every language, installable with pip.
#
# Two packages, in python/: tcsxtce, the packet runtime and the digest,
# which are operational code; and tcs_xtce, a software tool, with the XML
# binding at its top, the compiler in tcs_xtce.compiler, the XML binding's
# generator in tcs_xtce.binding and the digest's command line in
# tcs_xtce.digest_cli. This file is at the repository's root so that the
# package can carry the README and the license files.
# python/tcs_xtce/generated.py is not in git -- `make generate` writes it
# from the XTCE schema -- so build the package with `make python-dist`,
# which writes it first and checks that the wheel holds it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcs-xtce"
# The same as the Rust crate's, in rust/Cargo.toml.
version = "0.7.0"
description = """\
    Serialization and deserialization of OMG XTCE documents into managed, \
    preallocated buffers, a compiler of packet codecs, and tcsxtce, the \
    packet runtime they fly with\
"""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "David VomLehn" }]
keywords = ["xtce", "ccsds", "telemetry", "omg", "spacecraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/vomlehn/tcs-xtce"
Documentation = "https://vomlehn.github.io/tcs-xtce/docs/manual.html"
"Rust crate" = "https://crates.io/crates/tcs-xtce"

[project.scripts]
tcs-xtce = "tcs_xtce.__main__:main"
xtce-digest = "tcs_xtce.digest_cli.__main__:main"

[tool.setuptools]
# The compiler uses tcs_xtce.binding's line wrapping and rustfmt.
packages = ["tcsxtce", "tcs_xtce", "tcs_xtce.compiler", "tcs_xtce.binding",
            "tcs_xtce.digest_cli"]

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.package-data]
tcsxtce = ["py.typed"]
tcs_xtce = ["py.typed"]
