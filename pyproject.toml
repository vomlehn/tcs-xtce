# tcs-xtce's Python distribution: the compiler that generates code in every
# language, and the XML binding it reads XTCE with, installable with pip.
# Software tools; the packet runtime that generated Python code imports,
# tcsxtce, is operational code and a distribution of its own, in
# python/pyproject.toml, which this one depends on.
#
# In python/: tcs_xtce, with the XML binding at its top, the compiler in
# tcs_xtce.compiler, the XML binding's generator in tcs_xtce.binding and
# the digest's command line in tcs_xtce.digest_cli. This file is at the
# repository's root so that the package can carry the license files.
# README-pypi.md is its page on PyPI, with every link absolute; README.md
# is the repository's. python/tcs_xtce/generated.py is not in git -- `make
# generate` writes it from the XTCE schema -- so build the package with
# `make python-dist`, which writes it first and checks that the wheel
# holds it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tcs-xtce"
# tcs-xtce's version, which the Makefile reads for the .deb and the RPM
# too, and the same as the tcs-xtce crate's, in rust/Cargo.toml.
version = "0.7.1"
description = """\
    An XTCE compiler: generates the code that packs and unpacks a \
    mission's XTCE commands and telemetry, in C/C++, Rust and Python\
"""
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
# The runtime generated Python code imports, of the same minor version,
# which is what the compiler generates for.
dependencies = ["tcsxtce ~= 0.7.0"]
authors = [{ name = "David VomLehn" }]
keywords = ["xtce", "ccsds", "telemetry", "omg", "spacecraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/vomlehn/tcs-xtce"
Documentation = "https://vomlehn.github.io/tcs-xtce/docs/tcs-xtce.html"
"Rust crate" = "https://crates.io/crates/tcs-xtce"

[project.scripts]
tcs-xtce = "tcs_xtce.__main__:main"
xtce-digest = "tcs_xtce.digest_cli.__main__:main"

[tool.setuptools]
# The compiler uses tcs_xtce.binding's line wrapping and rustfmt.
packages = ["tcs_xtce", "tcs_xtce.compiler", "tcs_xtce.binding",
            "tcs_xtce.digest_cli"]

[tool.setuptools.package-dir]
"" = "python"

[tool.setuptools.package-data]
tcs_xtce = ["py.typed"]
