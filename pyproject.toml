# tcs-xtce's Python distribution, a library installable with pip: the XML
# binding that reads and writes XTCE documents, and the compiler that
# generates code in every language from them. It installs no commands:
# the compiler runs as `python3 -m tcs_xtce`, and the .deb and the RPM,
# not pip, install the tcs-xtce and xtce-digest commands.
# Software tools; the packet runtime that generated Python code imports,
# tcsxtce, is operational code and a distribution of its own, in
# python/pyproject.toml, which this one depends on.
#
# In python/: tcs_xtce, with the XML binding at its top, the compiler in
# tcs_xtce.compiler, the XML binding's generator in tcs_xtce.binding and
# the digest's command line in tcs_xtce.digest_cli. This file is at the
# repository's root so that the package can carry the license files.
# README-pypi.md is its page on PyPI, with every link absolute; README.md
# is the repository's. python/tcs_xtce/generated.py and
# rust/tcs-xtce-python/src/generated.rs are not in git -- `make generate`
# writes them from the XTCE schema -- so build the package with `make
# python-dist`, which writes them first and checks that the wheel holds
# them.
#
# It reads and writes XML through the tcs-xtce crate: maturin builds the
# extension module tcs_xtce._native from rust/tcs-xtce-python, with PyO3's
# stable ABI from Python 3.10, so each wheel is for one platform and every
# Python from 3.10 on, and building the sdist needs a Rust toolchain.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "tcs-xtce"
# tcs-xtce's version, which the Makefile reads for the .deb and the RPM
# too, and the same as the tcs-xtce crate's, in rust/Cargo.toml.
version = "0.7.2"
description = """\
    An XTCE library: reads, writes and builds OMG XTCE documents, and \
    generates the code that packs and unpacks a mission's commands and \
    telemetry, in C/C++, Rust and Python\
"""
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
# The runtime generated Python code imports, of the same minor version,
# which is what the compiler generates for.
dependencies = ["tcsxtce ~= 0.7.0"]
authors = [{ name = "David VomLehn" }]
keywords = ["xtce", "ccsds", "telemetry", "omg", "spacecraft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/vomlehn/tcs-xtce"
Documentation = "https://vomlehn.github.io/tcs-xtce/docs/tcs-xtce.html"
"Rust crate" = "https://crates.io/crates/tcs-xtce"

[tool.maturin]
# The package tcs_xtce in python/, with its subpackages: the compiler uses
# tcs_xtce.binding's line wrapping and rustfmt.
python-source = "python"
module-name = "tcs_xtce._native"
manifest-path = "rust/tcs-xtce-python/Cargo.toml"
# Without its symbols, which a user's wheel has no use for.
strip = true
# Generated, so not in git, but in the wheel and the sdist.
include = [
    { path = "python/tcs_xtce/generated.py", format = ["sdist", "wheel"] },
    { path = "rust/tcs-xtce-python/src/generated.rs", format = "sdist" },
]
# The extension module make builds in place, which the wheel's own build
# replaces.
exclude = ["python/tcs_xtce/_native*.so"]
