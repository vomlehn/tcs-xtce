# Build everything from a clean checkout and run every test, so anything
# that only works because of files left over in a working tree is caught.
# tcs-helpers is checked out beside it, as on a developer's machine: make
# test runs its html-pages and production-names.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcs-xtce
    steps:
      - uses: actions/checkout@v4
        with:
          path: tcs-xtce
      - uses: actions/checkout@v4
        with:
          repository: vomlehn/tcs-helpers
          path: tcs-helpers

      # The oldest Python building and testing support: tcs-helpers'
      # production-names, which make test runs, needs 3.11's tomllib.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # What building and testing need, as a developer installs it.
      - name: Install tools
        run: bin/install-tools --no-packaging

      # The OMG documents change only with a new XTCE release; caching them
      # keeps every run from downloading them.
      - name: Cache XTCE references
        uses: actions/cache@v4
        with:
          path: |
            tcs-xtce/references/*
            !tcs-xtce/references/Makefile
          key: references-${{ hashFiles('tcs-xtce/references/Makefile') }}

      - name: Cache public XTCE documents
        uses: actions/cache@v4
        with:
          path: tcs-xtce/tests/external/files
          key: external-${{ hashFiles('tcs-xtce/tests/external/sources.txt') }}

      - name: Build and test
        run: make

      - name: Check public XTCE documents
        run: make samples-check

      # The crate packages src/generated.rs, which make wrote above and git
      # ignores, so cargo counts it as uncommitted: hence --allow-dirty.
      - name: Check that the Rust crate packages and builds
        run: cd rust && cargo publish --dry-run --allow-dirty
